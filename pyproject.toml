[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dspace-rest-client"
version = "0.2.0"
description = "A DSpace 7 REST API client library"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [
    { name = "Kim Shepherd" },
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests",
]

[project.optional-dependencies]
solr = ["pysolr>=3.9"]
dev = [
    "pytest",
    "requests-mock",
    "ruff",
    "pylint",
    "mypy",
]
release = [
    "build>=1.2",
    "twine>=5.1",
]

[project.urls]
Documentation = "https://github.com/the-library-code/dspace-rest-python/blob/main/README.md"
GitHub = "https://github.com/the-library-code/dspace-rest-python"
Changelog = "https://github.com/the-library-code/dspace-rest-python/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["dspace_rest_client"]

[tool.autopep8]
max_line_length = 90

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
# E = pycodestyle, F = pyflakes, T20 = flake8-print (no print())
select = ["E", "F", "T20"]
# E501 only: the upstream sources still carry long docstring/log lines that a
# reflow would churn for no benefit. Everything else is enforced.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pylint.main]
py-version = "3.10"
jobs = 0

[tool.pylint.basic]
no-docstring-rgx = "^_"

[tool.pylint.design]
max-args = 10
max-attributes = 15
max-branches = 15
max-locals = 20
max-public-methods = 20
max-returns = 8
max-statements = 60

[tool.pylint.format]
max-line-length = 90
max-module-lines = 1200

[tool.pylint.imports]
allow-wildcard-with-all = false

[tool.pylint.logging]
logging-format-style = "old"

[tool.pylint."messages control"]
# camelCase attrs and method names mirror the DSpace API verbatim
# (invalid-name), so it stays off project-wide and no good-names allowlist is
# needed; f-strings in log calls are mandated by the project
# (logging-fstring-interpolation). import-error: pysolr is an optional extra
# not present in every lint env. too-many-lines / too-many-public-methods:
# DSpaceClient is a wide REST facade (one method per endpoint); splitting into
# endpoint mixins is a tracked follow-up, not a blocker. fixme: upstream TODO
# markers are informational, not defects. Broad `except Exception` catches are
# NOT disabled globally - the few deliberate fallback paths carry an inline
# `# pylint: disable=broad-exception-caught`.
disable = [
    "missing-function-docstring",
    "missing-class-docstring",
    "missing-module-docstring",
    "invalid-name",
    "import-error",
    "import-outside-toplevel",
    "logging-fstring-interpolation",
    "line-too-long",
    "too-few-public-methods",
    "too-many-branches",
    "too-many-locals",
    "too-many-nested-blocks",
    "too-many-positional-arguments",
    "too-many-lines",
    "too-many-public-methods",
    "fixme",
]
